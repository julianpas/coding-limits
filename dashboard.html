<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<title>AI Limits · usage</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📊%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg: #0b0f14;
    --card: #131a22;
    --card-edge: #223040;
    --text: #e6edf3;
    --muted: #8b98a5;
    --ok: #34d399;
    --warn: #fbbf24;
    --bad: #f87171;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    background: radial-gradient(1100px 500px at 50% -120px, #17222e 0%, var(--bg) 60%) fixed, var(--bg);
    color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: max(18px, env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom));
  }
  .wrap { max-width: 1060px; margin: 0 auto; }

  header {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; flex-wrap: wrap; margin-bottom: 16px;
  }
  h1 { font-size: clamp(19px, 3.4vw, 24px); margin: 0; font-weight: 700; letter-spacing: -0.01em; }
  .sub { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
  #refresh {
    border: 1px solid var(--card-edge); background: #182230; color: var(--text);
    padding: 8px 14px; border-radius: 10px; cursor: pointer; font-size: 14px;
  }
  #refresh:hover:not(:disabled) { background: #1f2c3d; }
  #refresh:disabled { opacity: .55; cursor: default; }

  .banner {
    background: rgba(248, 113, 113, .1); border: 1px solid rgba(248, 113, 113, .4);
    color: #fca5a5; border-radius: 12px; padding: 10px 14px; margin-bottom: 14px;
    font-size: 14px; word-break: break-word;
  }
  .hidden { display: none; }

  .grid {
    display: grid; gap: 14px;
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr));
  }
  .card {
    background: var(--card); border: 1px solid var(--card-edge);
    border-radius: 16px; padding: 16px;
    animation: rise .35s ease both;
  }
  .card:nth-child(2) { animation-delay: .06s; }
  .card:nth-child(3) { animation-delay: .12s; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .card.error { border-color: rgba(248, 113, 113, .5); }
  .card.disabled { opacity: .55; }

  .cardhead { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .cardhead h2 { font-size: 16px; margin: 0; font-weight: 600; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c, #8b98a5); box-shadow: 0 0 8px var(--c, transparent); flex: none; }
  .plan { font-size: 12px; color: var(--muted); }
  .pill {
    margin-left: auto; font-size: 10.5px; letter-spacing: .05em; text-transform: uppercase;
    padding: 2px 9px; border-radius: 999px; border: 1px solid; white-space: nowrap;
  }
  .pill.on  { color: var(--ok);   border-color: rgba(52,211,153,.4);  background: rgba(52,211,153,.08); }
  .pill.off { color: var(--muted); border-color: rgba(139,152,165,.35); background: rgba(139,152,165,.08); }
  .pill.stale { color: var(--warn); border-color: rgba(251,191,36,.4);  background: rgba(251,191,36,.08); }

  .gauges { display: flex; gap: 10px; margin-top: 14px; }
  .gauge { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .ring { position: relative; width: clamp(92px, 25vw, 120px); }
  .ring svg { display: block; width: 100%; height: auto; }
  .ring circle { fill: none; stroke-width: 9; }
  .ring .bg { stroke: rgba(255, 255, 255, .08); }
  .ring .fg {
    stroke: var(--muted); stroke-linecap: round;
    transform: rotate(-90deg); transform-origin: 50% 50%;
    transition: stroke-dashoffset .7s cubic-bezier(.22,1,.36,1), stroke .3s;
  }
  .fg.ok   { stroke: var(--ok); }
  .fg.warn { stroke: var(--warn); }
  .fg.bad  { stroke: var(--bad); }
  .val {
    position: absolute; inset: 0; display: grid; place-items: center;
    font-weight: 700; font-size: clamp(17px, 5.2vw, 23px); font-variant-numeric: tabular-nums;
  }
  .val small { font-size: .58em; font-weight: 600; color: var(--muted); margin-left: 1px; }
  .glabel { font-size: 13px; font-weight: 600; margin-top: 8px; }
  .greset { font-size: 12px; color: var(--muted); }
  .ghost { width: 100%; aspect-ratio: 1; border-radius: 50%; border: 9px solid rgba(255,255,255,.06); }

  .credits {
    margin-top: 12px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,.06);
    font-size: 13px; color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap;
  }
  .credits b { color: var(--text); font-weight: 600; }

  .err {
    margin-top: 12px; font-size: 13px; color: #fca5a5;
    background: rgba(248,113,113,.08); border: 1px solid rgba(248,113,113,.35);
    padding: 9px 11px; border-radius: 10px; word-break: break-word;
  }
  .muted { color: var(--muted); font-size: 14px; margin: 12px 0 0; }

  footer { margin-top: 18px; text-align: center; font-size: 12.5px; color: var(--muted); }
  footer a { color: inherit; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>AI Usage Limits</h1>
      <p class="sub"><span id="device">…</span> · updated <span id="updated">—</span></p>
    </div>
    <button id="refresh" type="button">↻ Refresh</button>
  </header>

  <div id="banner" class="banner hidden" role="alert"></div>

  <main id="providers" class="grid" aria-live="polite"></main>

  <footer>
    coding-limits <span id="version"></span> · auto-refreshes every 30 s ·
    <a href="/api/v1/snapshot" target="_blank" rel="noopener">raw JSON</a>
  </footer>
</div>

<script>
"use strict";

const CIRC = 2 * Math.PI * 42;
const REFRESH_MS = 30000;
const META = {
  codex:  { label: "Codex",  color: "#34d399" },
  claude: { label: "Claude", color: "#fb923c" },
  gemini: { label: "Gemini", color: "#60a5fa" },
};
const ORDER = ["codex", "claude", "gemini"];

// Optional token support: open http://host:8765/?token=SECRET when ACCESS_TOKEN is set.
const TOKEN = new URLSearchParams(location.search).get("token") || "";

const state = { lastUpdated: null, busy: false };

function esc(s) {
  const d = document.createElement("span");
  d.textContent = s == null ? "" : String(s);
  return d.innerHTML;
}

function fmtCountdown(resetsAt) {
  if (!resetsAt) return null;
  const ms = resetsAt * 1000 - Date.now();
  if (ms <= 0) return "just now";
  const m = Math.floor(ms / 60000);
  if (m < 60) return m + "m";
  const h = Math.floor(m / 60);
  if (h < 24) return h + "h " + (m % 60) + "m";
  const d = Math.floor(h / 24);
  return d + "d " + (h % 24) + "h";
}

function gauge(w) {
  if (!w || (w.remainingPercent == null && w.usedPercent == null && !w.label)) {
    return '<div class="gauge"><div class="ring"><div class="ghost"></div></div>' +
           '<div class="glabel">—</div><div class="greset">no data</div></div>';
  }
  const pct = w.remainingPercent != null ? Number(w.remainingPercent) : null;
  const off = pct == null ? CIRC : CIRC * (1 - Math.max(0, Math.min(100, pct)) / 100);
  const cls = pct == null ? "" : pct >= 50 ? "ok" : pct >= 20 ? "warn" : "bad";
  const cd = fmtCountdown(w.resetsAt);
  return '<div class="gauge" role="img" aria-label="' + esc(w.label) + ' remaining ' + (pct == null ? "unknown" : pct + "%") + '">' +
    '<div class="ring"><svg viewBox="0 0 100 100" aria-hidden="true">' +
      '<circle class="bg" cx="50" cy="50" r="42"></circle>' +
      '<circle class="fg ' + cls + '" cx="50" cy="50" r="42" stroke-dasharray="' + CIRC + '" stroke-dashoffset="' + off + '"></circle>' +
    '</svg><div class="val">' + (pct == null ? "—" : Math.round(pct)) + (pct == null ? "" : "<small>%</small>") + '</div></div>' +
    '<div class="glabel">' + esc(w.label || "window") + '</div>' +
    '<div class="greset">' + (cd ? "resets in " + esc(cd) : "reset time n/a") + '</div></div>';
}

function creditsLine(p) {
  const c = p.credits;
  if (!c) return "";
  if (c.unlimited) return "<b>Unlimited</b> credits";
  if (c.hasCredits && c.balance != null) return "Credit balance · <b>$" + Number(c.balance).toFixed(2) + "</b>";
  if (c.usedCreditsCents != null) {
    const used = (c.usedCreditsCents / 100).toFixed(2);
    const limit = c.monthlyLimitCents != null ? (c.monthlyLimitCents / 100).toFixed(2) : null;
    return "Monthly credits · <b>$" + used + "</b>" + (limit ? " of $" + limit + " used" : "");
  }
  return "";
}

function card(name, p) {
  const meta = META[name] || { label: name, color: "#8b98a5" };
  if (!p || p.enabled === false) {
    return '<section class="card disabled">' +
      '<div class="cardhead"><span class="dot" style="--c:' + meta.color + '"></span><h2>' + esc(meta.label) + '</h2>' +
      '<span class="pill off">disabled</span></div>' +
      '<p class="muted">Not configured on this gateway.</p></section>';
  }
  let body, pill;
  if (p.ok) {
    body = '<div class="gauges">' + gauge(p.shortWindow) + gauge(p.longWindow) + '</div>';
    const cr = creditsLine(p);
    if (cr) body += '<div class="credits">' + cr + '</div>';
    pill = p.stale ? '<span class="pill stale">stale</span>' : '<span class="pill on">live</span>';
  } else {
    body = '<div class="err">' + esc(p.error || "fetch failed") + '</div>';
    pill = '<span class="pill off">error</span>';
  }
  const plan = p.planType ? '<span class="plan">' + esc(String(p.planType).toLowerCase()) + ' plan</span>' : "";
  return '<section class="card' + (p.ok ? "" : " error") + '">' +
    '<div class="cardhead"><span class="dot" style="--c:' + meta.color + '"></span><h2>' + esc(meta.label) + '</h2>' +
    plan + pill + '</div>' + body + '</section>';
}

function render(data) {
  const name = data.deviceName || "AI Limits";
  document.getElementById("device").textContent = name;
  document.title = name + " · usage";
  const v = document.getElementById("version");
  if (data.version) v.textContent = "v" + data.version;
  state.lastUpdated = Date.now();
  document.getElementById("updated").textContent = "just now";

  const provs = data.providers || {};
  const names = ORDER.filter(n => n in provs).concat(Object.keys(provs).filter(n => !ORDER.includes(n)));
  document.getElementById("providers").innerHTML = names.map(n => card(n, provs[n])).join("");
}

function showBanner(msg) {
  const b = document.getElementById("banner");
  b.textContent = msg;
  b.classList.remove("hidden");
}
function hideBanner() {
  document.getElementById("banner").classList.add("hidden");
}

async function refresh() {
  if (state.busy) return;
  state.busy = true;
  const btn = document.getElementById("refresh");
  btn.disabled = true;
  btn.textContent = "Refreshing…";
  try {
    const res = await fetch("/api/v1/snapshot", {
      cache: "no-store",
      headers: TOKEN ? { "X-Gauge-Token": TOKEN } : {},
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
    render(await res.json());
    hideBanner();
  } catch (e) {
    showBanner("Couldn't reach the gateway (" + e.message + "). It may be restarting.");
  } finally {
    state.busy = false;
    btn.disabled = false;
    btn.textContent = "↻ Refresh";
  }
}

document.getElementById("refresh").addEventListener("click", refresh);
setInterval(() => {
  if (!state.lastUpdated) return;
  const s = Math.floor((Date.now() - state.lastUpdated) / 1000);
  document.getElementById("updated").textContent = s < 5 ? "just now" : s + "s ago";
}, 1000);

refresh();
setInterval(refresh, REFRESH_MS);
</script>
</body>
</html>
